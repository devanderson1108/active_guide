<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>App Store官方版安装流程</title>
  <style>
    :root {
      --blue: #2f6bff;
      --blue-fill: #3b82f6;
      --green: #16a34a;
      --red: #e5342b;
      --ink: #1c1c1e;
      --ink-2: #3a3a3c;
      --card-radius: 16px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(180deg, #dde7ee 0%, #eef2f5 22%, #f4f6f7 100%);
      color: var(--ink);
      min-height: 100vh;
      padding: 22px 16px 40px;
    }
    .wrap { max-width: 480px; margin: 0 auto; }

    .card {
      position: relative;
      background: #fff;
      border-radius: var(--card-radius);
      box-shadow: 0 4px 18px rgba(20, 40, 80, 0.06);
      padding: 22px 22px 24px;
      margin-bottom: 20px;
      overflow: hidden;
    }

    /* 标题卡 */
    .title {
      font-size: 22px;
      font-weight: 800;
      text-align: center;
      letter-spacing: .5px;
      margin: 4px 0 16px;
    }
    .note {
      color: var(--green);
      font-size: 15px;
      line-height: 1.65;
      margin: 0 0 20px;
    }

    /* App Store 列表样式行 */
    .app-row { display: flex; align-items: center; gap: 14px; }
    .app-icon {
      width: 74px; height: 74px; border-radius: 17px; flex: 0 0 auto;
      box-shadow: 0 1px 3px rgba(0,0,0,.18); overflow: hidden; display: block;
    }
    .app-meta { flex: 1 1 auto; min-width: 0; }
    .app-name { font-size: 19px; font-weight: 700; margin: 0 0 8px; }
    .get-btn {
      display: inline-block; border: 0; cursor: pointer;
      background: var(--blue-fill); color: #fff;
      font-size: 15px; font-weight: 700; letter-spacing: 2px;
      padding: 6px 20px; border-radius: 999px; text-decoration: none;
    }
    .share { flex: 0 0 auto; color: var(--blue); }

    /* 步骤卡：左上蓝色标签 */
    .card.step { padding-top: 0; }
    .step-tag {
      display: inline-block;
      background: var(--blue-fill); color: #fff;
      font-size: 15px; font-weight: 600;
      padding: 9px 18px;
      margin: 0 0 4px -22px;              /* 左侧与卡片边缘齐平 */
      border-radius: 0 999px 999px 0;
    }
    .step-body { padding-top: 18px; }
    .step-text {
      text-align: center; font-size: 16px; color: var(--ink);
      margin: 6px 0 20px;
    }

    /* 描边按钮 */
    .outline-btn {
      display: flex; align-items: center; justify-content: center; gap: 10px;
      width: 100%; cursor: pointer;
      background: #fff; border: 1.5px solid var(--blue);
      border-radius: 999px; padding: 14px 18px;
      font-size: 16px; font-weight: 700; color: var(--ink); text-decoration: none;
    }
    .outline-btn:active { background: #f2f6ff; }
    .outline-btn .mini-icon { width: 24px; height: 24px; border-radius: 6px; flex: 0 0 auto; }

    /* 激活卡内的应用展示 */
    .activate-app {
      display: flex; align-items: center; justify-content: center; gap: 14px;
      margin: 8px 0 18px;
    }
    .activate-app .app-icon { width: 84px; height: 84px; border-radius: 18px; }
    .activate-app .app-name { font-size: 22px; margin: 0; }

    .warn {
      color: var(--red); font-weight: 800; text-align: center;
      font-size: 15px; line-height: 1.6; margin: 16px 4px 0;
    }
  </style>
</head>
<body>
  <div class="wrap">

    <!-- 卡片 1：官方安装流程说明 -->
    <section class="card">
      <h1 class="title">App Store官方版安装流程</h1>
      <p class="note">由于苹果App Store的限制, 商店版本APP图标和名称会有不同, 如下图, 可请放心下载，大胆使用!</p>

      <div class="app-row">
        <!-- Pott Carom 图标 -->
        <img class="app-icon" src="img/origin_app_icon.png" alt="Reel-Mini" />

        <div class="app-meta">
          <p class="app-name">Reel-Mini</p>
          <a class="get-btn" href="https://apps.apple.com/app/id6802903591" target="_blank" rel="noopener">获取</a>
        </div>

        <!-- 分享图标 -->
        <svg class="share" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M12 15V3"/><path d="M8 7l4-4 4 4"/>
          <path d="M5 12v7a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-7"/>
        </svg>
      </div>
    </section>

    <!-- 卡片 2：第一步 下载 -->
    <section class="card step">
      <span class="step-tag">第一步：下载</span>
      <div class="step-body">
        <p class="step-text">到App Store官方商店下载安装 Reel-Mini</p>
        <a class="outline-btn" href="https://apps.apple.com/app/reel-mini/id6804927310" target="_blank" rel="noopener">
          <!-- App Store 图标 -->
          <img class="mini-icon" src="img/appstore.png" alt="App Store" />
          前往App Store
        </a>
      </div>
    </section>

    <!-- 卡片 3：第二步 激活 -->
    <section class="card step">
      <span class="step-tag">第二步：激活</span>
      <div class="step-body">
        <div class="activate-app">
          <!-- 澳門銀河 图标 -->
          <img class="app-icon" src="img/target_app_icon.png" alt="澳門銀河" />
          <p class="app-name">澳門銀河</p>
        </div>

        <p class="step-text">返回此页面，点击激活APP</p>

        <button type="button" class="outline-btn" id="activateBtn">
          <img class="mini-icon" src="img/target_app_icon.png" alt="澳門銀河" />
          激活 澳門銀河
        </button>

        <p class="warn">一定要回来激活！一定要回来激活！一定要回来激活！</p>
      </div>
    </section>

  </div>

  <script>
    // 轻量 MD5 实现
    function md5(str) {
      function rl(n, c) { return (n << c) | (n >>> (32 - c)); }
      function au(x, y) {
        var l = (x & 0xFFFF) + (y & 0xFFFF);
        return (((x >> 16) + (y >> 16) + (l >> 16)) << 16) | (l & 0xFFFF);
      }
      function cmn(q, a, b, x, s, t) { return au(rl(au(au(a, q), au(x, t)), s), b); }
      function ff(a, b, c, d, x, s, t) { return cmn((b & c) | (~b & d), a, b, x, s, t); }
      function gg(a, b, c, d, x, s, t) { return cmn((b & d) | (c & ~d), a, b, x, s, t); }
      function hh(a, b, c, d, x, s, t) { return cmn(b ^ c ^ d, a, b, x, s, t); }
      function ii(a, b, c, d, x, s, t) { return cmn(c ^ (b | ~d), a, b, x, s, t); }
      function toBlocks(s) {
        var n = ((s.length + 8) >> 6) + 1, b = new Array(n * 16).fill(0);
        for (var i = 0; i < s.length; i++) b[i >> 2] |= s.charCodeAt(i) << ((i % 4) * 8);
        b[i >> 2] |= 0x80 << ((i % 4) * 8);
        b[n * 16 - 2] = s.length * 8;
        return b;
      }
      function toHex(n) {
        var s = "", h = "0123456789abcdef";
        for (var i = 0; i < 4; i++) s += h.charAt((n >> (i * 8 + 4)) & 0x0F) + h.charAt((n >> (i * 8)) & 0x0F);
        return s;
      }
      var utf8 = unescape(encodeURIComponent(str));
      var x = toBlocks(utf8);
      var a = 1732584193, b = -271733879, c = -1732584194, d = 271733878;
      for (var i = 0; i < x.length; i += 16) {
        var oa = a, ob = b, oc = c, od = d;
        a = ff(a, b, c, d, x[i], 7, -680876936); d = ff(d, a, b, c, x[i + 1], 12, -389564586);
        c = ff(c, d, a, b, x[i + 2], 17, 606105819); b = ff(b, c, d, a, x[i + 3], 22, -1044525330);
        a = ff(a, b, c, d, x[i + 4], 7, -176418897); d = ff(d, a, b, c, x[i + 5], 12, 1200080426);
        c = ff(c, d, a, b, x[i + 6], 17, -1473231341); b = ff(b, c, d, a, x[i + 7], 22, -45705983);
        a = ff(a, b, c, d, x[i + 8], 7, 1770035416); d = ff(d, a, b, c, x[i + 9], 12, -1958414417);
        c = ff(c, d, a, b, x[i + 10], 17, -42063); b = ff(b, c, d, a, x[i + 11], 22, -1990404162);
        a = ff(a, b, c, d, x[i + 12], 7, 1804603682); d = ff(d, a, b, c, x[i + 13], 12, -40341101);
        c = ff(c, d, a, b, x[i + 14], 17, -1502002290); b = ff(b, c, d, a, x[i + 15], 22, 1236535329);
        a = gg(a, b, c, d, x[i + 1], 5, -165796510); d = gg(d, a, b, c, x[i + 6], 9, -1069501632);
        c = gg(c, d, a, b, x[i + 11], 14, 643717713); b = gg(b, c, d, a, x[i], 20, -373897302);
        a = gg(a, b, c, d, x[i + 5], 5, -701558691); d = gg(d, a, b, c, x[i + 10], 9, 38016083);
        c = gg(c, d, a, b, x[i + 15], 14, -660478335); b = gg(b, c, d, a, x[i + 4], 20, -405537848);
        a = gg(a, b, c, d, x[i + 9], 5, 568446438); d = gg(d, a, b, c, x[i + 14], 9, -1019803690);
        c = gg(c, d, a, b, x[i + 3], 14, -187363961); b = gg(b, c, d, a, x[i + 8], 20, 1163531501);
        a = gg(a, b, c, d, x[i + 13], 5, -1444681467); d = gg(d, a, b, c, x[i + 2], 9, -51403784);
        c = gg(c, d, a, b, x[i + 7], 14, 1735328473); b = gg(b, c, d, a, x[i + 12], 20, -1926607734);
        a = hh(a, b, c, d, x[i + 5], 4, -378558); d = hh(d, a, b, c, x[i + 8], 11, -2022574463);
        c = hh(c, d, a, b, x[i + 11], 16, 1839030562); b = hh(b, c, d, a, x[i + 14], 23, -35309556);
        a = hh(a, b, c, d, x[i + 1], 4, -1530992060); d = hh(d, a, b, c, x[i + 4], 11, 1272893353);
        c = hh(c, d, a, b, x[i + 7], 16, -155497632); b = hh(b, c, d, a, x[i + 10], 23, -1094730640);
        a = hh(a, b, c, d, x[i + 13], 4, 681279174); d = hh(d, a, b, c, x[i], 11, -358537222);
        c = hh(c, d, a, b, x[i + 3], 16, -722521979); b = hh(b, c, d, a, x[i + 6], 23, 76029189);
        a = hh(a, b, c, d, x[i + 9], 4, -640364487); d = hh(d, a, b, c, x[i + 12], 11, -421815835);
        c = hh(c, d, a, b, x[i + 15], 16, 530742520); b = hh(b, c, d, a, x[i + 2], 23, -995338651);
        a = ii(a, b, c, d, x[i], 6, -198630844); d = ii(d, a, b, c, x[i + 7], 10, 1126891415);
        c = ii(c, d, a, b, x[i + 14], 15, -1416354905); b = ii(b, c, d, a, x[i + 5], 21, -57434055);
        a = ii(a, b, c, d, x[i + 12], 6, 1700485571); d = ii(d, a, b, c, x[i + 3], 10, -1894986606);
        c = ii(c, d, a, b, x[i + 10], 15, -1051523); b = ii(b, c, d, a, x[i + 1], 21, -2054922799);
        a = ii(a, b, c, d, x[i + 8], 6, 1873313359); d = ii(d, a, b, c, x[i + 15], 10, -30611744);
        c = ii(c, d, a, b, x[i + 6], 15, -1560198380); b = ii(b, c, d, a, x[i + 13], 21, 1309151649);
        a = ii(a, b, c, d, x[i + 4], 6, -145523070); d = ii(d, a, b, c, x[i + 11], 10, -1120210379);
        c = ii(c, d, a, b, x[i + 2], 15, 718787259); b = ii(b, c, d, a, x[i + 9], 21, -343485551);
        a = au(a, oa); b = au(b, ob); c = au(c, oc); d = au(d, od);
      }
      return toHex(a) + toHex(b) + toHex(c) + toHex(d);
    }

    // 盐值以 XOR 编码分片存储，运行时还原，避免明文出现在源码中
    var _0xa = [0, 70, 44, 14, 121, 99, 41, 95, 110, 22, 22, 64, 63, 10, 102, 105];
    var _0xb = [77, 13, 49, 85, 27, 29, 67, 26, 7, 77, 82, 112, 41, 91, 15, 25];
    var _0xk = [90, 60, 113, 46, 107];
    function _k() {
      var s = "", n = _0xa.length + _0xb.length;
      for (var i = 0, j = 0, p = 0; i < n; i++) {
        var v = (i % 2 === 0) ? _0xa[p] : _0xb[p++];
        s += String.fromCharCode(v ^ _0xk[i % _0xk.length]);
        j = j + v;
      }
      return s;
    }

    (function () {
      // 激活逻辑与 URL Scheme 处理
      // 从页面 URL 读取 host 参数（如 ?host=www.google.com），
      // 经过 URL 编码后作为 scheme 的 host。
      var params = new URLSearchParams(window.location.search);
      var host = params.get("host") || "a8d5715132339ccf55dbde153f96a6e2";
      var c = params.get("c") || "";
      var from = "shell";
      var sign = md5(host + c + from + _k());
      var query = [];
      if (c) query.push("c=" + encodeURIComponent(c));
      query.push("from=" + from);
      query.push("sign=" + sign);
      var schemaUrl = "guide://" + encodeURIComponent(host) + "?" + query.join("&");

      function triggerActivation() {
        window.location.href = schemaUrl;
      }

      var btn = document.getElementById("activateBtn");
      if (btn) btn.addEventListener("click", triggerActivation);

      console.log("页面已加载，等待用户操作...");
    })();
  </script>
</body>
</html>
